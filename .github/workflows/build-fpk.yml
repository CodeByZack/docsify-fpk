name: Build FPK

# 轻量打包：docsify 纯静态 + node 内置模块，无原生依赖、无符号链接。
# 官方 fnpack 的 platform 仅支持 x86|arm，故双架构矩阵各打一份。
#
# 触发方式（仅这两种，push main 不构建）：
#   - 自动：push tag v*（产物同时挂到 GitHub Release）
#   - 手动：workflow_dispatch（可填 tag 输入，产物发到对应 Release）
#
# 注意：
#   - fnpack 固定 1.2.0 并校验 sha256（1.2.1 会把符号链接改写为死链导致 fnOS
#     安装器报 10234 装不上；本项目虽无符号链接，仍固定版本保证可复现）。
#   - fnpack 官方二进制：https://static2.fnnas.com/fnpack/fnpack-<ver>-linux-<amd64|arm64>

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag to publish (e.g. v1.0.0, 与 fpk 版本号一致)"
        required: false
        default: ""

permissions:
  contents: read

env:
  FNPACK_VERSION: "1.2.0"

jobs:
  build:
    name: Build FPK (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm
            runner: ubuntu-24.04-arm
            fnpack_arch: arm64
            fnpack_sha256: 33a76a7c685832b8de1adff3a6362c384bf367988d819e98bcf85569bb219d30
          - arch: x86
            runner: ubuntu-latest
            fnpack_arch: amd64
            fnpack_sha256: 523227c950a589ab3af327cf91c45511154265487bf723b29da9cfa2e0dc9d5a

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout tag commit (workflow_dispatch with tag)
        if: github.event_name == 'workflow_dispatch' && inputs.tag != ''
        run: |
          git fetch --tags
          if git rev-parse "refs/tags/${{ inputs.tag }}" >/dev/null 2>&1; then
            git checkout "${{ inputs.tag }}"
          else
            echo "::error::Tag ${{ inputs.tag }} does not exist. Create it first: git tag ${{ inputs.tag }} && git push origin ${{ inputs.tag }}"
            exit 1
          fi

      - name: Install fnpack 1.2.0 (${{ matrix.fnpack_arch }})
        run: |
          curl -fsSL -o /tmp/fnpack "https://static2.fnnas.com/fnpack/fnpack-${FNPACK_VERSION}-linux-${{ matrix.fnpack_arch }}"
          echo "${{ matrix.fnpack_sha256 }}  /tmp/fnpack" | sha256sum -c -
          chmod +x /tmp/fnpack
          echo "/tmp" >> "${GITHUB_PATH}"
          /tmp/fnpack --help >/dev/null
          echo "fnpack OK: /tmp/fnpack"

      - name: Resolve fpk version
        id: version
        run: |
          V=""
          if [ "${{ github.event_name }}" = "push" ]; then
            V="${GITHUB_REF_NAME#v}"
          elif [ -n "${{ inputs.tag }}" ]; then
            V="${{ inputs.tag }}"
            V="${V#v}"
          fi
          echo "version=${V}" >> "${GITHUB_OUTPUT}"

      - name: Build fpk (ARCH=${{ matrix.arch }})
        env:
          VERSION: ${{ steps.version.outputs.version }}
          ARCH: ${{ matrix.arch }}
        run: ./fpk/build-fpk.sh

      - name: Upload fpk artifact (${{ matrix.arch }})
        uses: actions/upload-artifact@v4
        with:
          name: fpk-${{ matrix.arch }}
          path: fpk/dist/*.fpk
          if-no-files-found: error
          retention-days: 7

  # 发布闸门：两个架构都成功才发 Release（避免只挂上一个架构）。
  # 仅 tag push 或 workflow_dispatch 带 tag 输入时执行；纯手动验证（不带 tag）只传 artifact。
  release:
    needs: [build]
    if: needs.build.result == 'success' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.tag != ''))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Determine release tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "tag=${GITHUB_REF_NAME}" >> "${GITHUB_OUTPUT}"
          else
            echo "tag=${{ inputs.tag }}" >> "${GITHUB_OUTPUT}"
          fi
      - name: Download fpk artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Upload fpk files to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          files: dist/*.fpk
          generate_release_notes: true
